apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-qr-bot
  labels:
    app: slack-qr-bot
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: slack-qr-bot
  template:
    metadata:
      labels:
        app: slack-qr-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: slack-qr-bot
          image: somaz940/slack-qr-bot:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-qr-bot-secret
                  key: SLACK_BOT_TOKEN
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: slack-qr-bot-api-key
                  key: API_KEY
            - name: RATE_LIMIT_ENABLED
              value: "false"
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: slack-qr-bot
  labels:
    app: slack-qr-bot
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: slack-qr-bot
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slack-qr-bot
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: slack-qr-bot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slack-qr-bot
                port:
                  name: http
